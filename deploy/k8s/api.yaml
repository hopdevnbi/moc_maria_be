apiVersion: apps/v1
kind: Deployment
metadata:
  name: moc-maria-api
  namespace: moc-maria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moc-maria-api
  template:
    metadata:
      labels:
        app: moc-maria-api
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/hopdevnbi/moc_maria_be@sha256:7f682b0180e69b8765b10e73fba76d42258e98e76936ec1831a9272f5c36b0ee
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: APP_ID
              value: MOC_MARIA
            - name: CHAT_TENANT
              value: MOC_MARIA
            - name: QUEUE_SOURCE
              value: MOC_MARIA
            - name: QUEUE_SERVICE_URL
              value: http://moc-maria-email-queue.moc-maria.svc.cluster.local
            - name: QUEUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moc-maria-email-secrets
                  key: QUEUE_API_KEY
            - name: DATABASE_POOL_MAX
              value: '3'
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/moc-maria-ca/supabase.crt
            - name: DATABASE_SSL
              value: 'true'
            - name: DATABASE_SSL_REJECT_UNAUTHORIZED
              value: 'true'
            - name: CORS_ORIGINS
              value: https://mocmaria.com,https://www.mocmaria.com,https://event.mocmaria.com
            - name: GIFT_EVENTS_ENABLED
              value: 'false'
            - name: GIFT_COUNTER_PIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: moc-maria-gift-counter
                  key: pin-secret
                  optional: true
            - name: AUTH_COOKIE_SECURE
              value: 'true'
            - name: SWAGGER_ENABLED
              value: 'false'
            - name: BUNNY_STORAGE_ZONE
              valueFrom:
                secretKeyRef:
                  name: moc-maria-avatar-storage
                  key: zone
            - name: BUNNY_STORAGE_REGION
              valueFrom:
                secretKeyRef:
                  name: moc-maria-avatar-storage
                  key: region
            - name: BUNNY_CDN_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: moc-maria-avatar-storage
                  key: cdn
            - name: BUNNY_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: moc-maria-avatar-storage
                  key: access-key
          envFrom:
            - secretRef:
                name: moc-maria-api-secrets
          volumeMounts:
            - name: database-ca
              mountPath: /etc/moc-maria-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: database-ca
          configMap:
            name: moc-maria-database-ca
---
apiVersion: v1
kind: Service
metadata:
  name: moc-maria-api
  namespace: moc-maria
spec:
  selector:
    app: moc-maria-api
  ports:
    - port: 80
      targetPort: 3000
