apiVersion: apps/v1
kind: Deployment
metadata:
  name: moc-maria-api
  namespace: moc-maria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moc-maria-api
  template:
    metadata:
      labels:
        app: moc-maria-api
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/hopdevnbi/moc_maria_be@sha256:dc3cb89ee11a0b536c4dfedc535efb078ddc57ed4244bbfeac3a9ed694ef343b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: APP_ID
              value: MOC_MARIA
            - name: CHAT_TENANT
              value: MOC_MARIA
            - name: QUEUE_SOURCE
              value: MOC_MARIA
            - name: DATABASE_POOL_MAX
              value: '3'
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/moc-maria-ca/supabase.crt
            - name: DATABASE_SSL
              value: 'true'
            - name: DATABASE_SSL_REJECT_UNAUTHORIZED
              value: 'true'
            - name: CORS_ORIGINS
              value: https://mocmaria.com,https://www.mocmaria.com
            - name: AUTH_COOKIE_SECURE
              value: 'true'
            - name: SWAGGER_ENABLED
              value: 'false'
          envFrom:
            - secretRef:
                name: moc-maria-api-secrets
          volumeMounts:
            - name: database-ca
              mountPath: /etc/moc-maria-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: database-ca
          configMap:
            name: moc-maria-database-ca
---
apiVersion: v1
kind: Service
metadata:
  name: moc-maria-api
  namespace: moc-maria
spec:
  selector:
    app: moc-maria-api
  ports:
    - port: 80
      targetPort: 3000
