name: One-time dashboard production route probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/dashboard-route-probe-once.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify live backend route without credentials
        shell: bash
        run: |
          set -euo pipefail
          live=$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' https://api.mocmaria.com/api/v1/health/live)
          ready=$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' https://api.mocmaria.com/api/v1/health/ready)
          route=$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' 'https://api.mocmaria.com/api/v1/admin/dashboard/overview?period=month&date=2026-10-17')
          echo "Live health HTTP: $live"
          echo "Ready health HTTP: $ready"
          echo "Unauthenticated dashboard route HTTP: $route"
          {
            echo "## Mộc Maria dashboard API route"
            echo ""
            echo "| Probe | HTTP status |"
            echo "|---|---|"
            echo "| live | $live |"
            echo "| ready | $ready |"
            echo "| dashboard (no JWT) | $route |"
            echo ""
            echo "401/403 = protected route exists; 404 = route missing from deployed backend."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$live" = "200"
          test "$ready" = "200"
          if [ "$route" != "401" ] && [ "$route" != "403" ]; then
            echo "::error::Dashboard protected route not found or unexpected status. Deployment not verified."
            exit 1
          fi
      - name: Remove temporary production probe workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/dashboard-route-probe-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ops): remove one-time production API probe"
          git push origin HEAD:main
