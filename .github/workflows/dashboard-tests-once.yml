name: Verify analytics regression tests once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-tests-once.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Format test
        run: npx prettier --write src/modules/admin-dashboard/admin-dashboard.service.spec.ts
      - name: Run full quality
        run: npm run quality
      - name: Commit test formatting and remove temporary workflow
        run: |
          git rm .github/workflows/dashboard-tests-once.yml
          git add src/modules/admin-dashboard/admin-dashboard.service.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(admin): verify dashboard report regression suite"
          git push origin HEAD:main
